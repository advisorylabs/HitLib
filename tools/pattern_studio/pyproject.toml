[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hitlib-pattern-studio"
dynamic = ["version"]
description = "Desktop pattern designer/previewer for HitLib LED profiles"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.6"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
build = ["pyinstaller>=6.0"]

[project.scripts]
pattern-studio = "pattern_studio.app:main"

[tool.hatch.version]
path = "pattern_studio/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["hitlib_sim", "pattern_studio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
