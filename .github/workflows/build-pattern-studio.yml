name: Build Pattern Studio

on:
  push:
    branches: [main]
    paths:
      - "tools/pattern_studio/**"
      - ".github/workflows/build-pattern-studio.yml"
  release:
    types: [created]

permissions:
  contents: write

defaults:
  run:
    working-directory: tools/pattern_studio

jobs:
  build:
    strategy:
      # One platform's build failing should still leave the others' binaries
      # attached to the release rather than cancelling them mid-run.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows
          # macOS runners are single-architecture and PyInstaller freezes for
          # whichever one it runs on, so Apple Silicon and Intel are two
          # builds. macos-13 is the last Intel image GitHub offers.
          - os: macos-14
            label: macos-arm64
          - os: macos-13
            label: macos-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,build]"

      - name: Run tests
        run: pytest -q

      - name: Build executable
        run: pyinstaller --noconfirm HitLibPatternStudio.spec

      - name: Package artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Select-String -Path pattern_studio/__init__.py -Pattern '__version__ = "(.*)"').Matches.Groups[1].Value
          Compress-Archive -Path dist/HitLibPatternStudio.exe -DestinationPath "HitLibPatternStudio-$version-${{ matrix.label }}.zip"

      - name: Package artifact (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' pattern_studio/__init__.py)
          # ditto, not zip: a .app is full of symlinks (every Qt framework has
          # a Versions/Current pointing at its real one), and an archiver that
          # follows them instead of storing them produces a bundle that both
          # bloats and refuses to launch.
          ditto -c -k --keepParent \
            dist/HitLibPatternStudio.app \
            "HitLibPatternStudio-$version-${{ matrix.label }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: hitlib-pattern-studio-${{ matrix.label }}
          path: tools/pattern_studio/HitLibPatternStudio-*.zip

      - name: Attach to GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release upload "${{ github.event.release.tag_name }}" HitLibPatternStudio-*.zip --clobber
