name: Build Pattern Studio

on:
  push:
    branches: [main]
    paths:
      - "tools/pattern_studio/**"
      - ".github/workflows/build-pattern-studio.yml"
  release:
    types: [created]

permissions:
  contents: write

defaults:
  run:
    working-directory: tools/pattern_studio

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,build]"

      - name: Run tests
        run: pytest -q

      - name: Build executable
        run: pyinstaller --noconfirm HitLibPatternStudio.spec

      - name: Package artifact
        shell: pwsh
        run: |
          $version = (Select-String -Path pyproject.toml -Pattern '^version = "(.*)"').Matches.Groups[1].Value
          Compress-Archive -Path dist/HitLibPatternStudio.exe -DestinationPath "HitLibPatternStudio-$version-windows.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: hitlib-pattern-studio-windows
          path: tools/pattern_studio/HitLibPatternStudio-*.zip

      - name: Attach to GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release upload "${{ github.event.release.tag_name }}" HitLibPatternStudio-*.zip --clobber
