name: Build PROS Template

on:
  push:
    branches: [main]
    # The storefront in site/ shares this repo but not this build.
    paths-ignore:
      - 'site/**'
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Both zips are named, and the conductor versions the template, from
      # template.pros, so it has to be bumped with the Makefile's VERSION.
      - name: Check template version
        run: |
          TEMPLATE_VERSION=$(python3 -c "import json; print(json.load(open('template.pros'))['version'])")
          MAKE_VERSION=$(sed -n 's/^VERSION:=//p' Makefile | tr -d '[:space:]')
          if [ "$TEMPLATE_VERSION" != "$MAKE_VERSION" ]; then
            echo "::error file=template.pros::template.pros is version $TEMPLATE_VERSION but the Makefile's VERSION is $MAKE_VERSION"
            exit 1
          fi

      - name: Install ARM embedded toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi

      - name: Install PROS CLI
        run: |
          pip install pros-cli

      - name: Build library
        run: make

      # Laid out as `make template` lays it out. `pros c apply` copies each
      # system file to the same path in the project, and a PROS project only
      # links the archives in firmware/. Only include/hitlib/ ships: the rest
      # of include/ is the kernel's, which the project already has.
      - name: Package template
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('template.pros'))['version'])")
          mkdir -p template_pkg/include template_pkg/firmware
          cp -r include/hitlib template_pkg/include/
          cp bin/hitlib.a template_pkg/firmware/
          cp template.pros template_pkg/
          cd template_pkg && zip -r ../hitlib@${VERSION}.zip .

      # VEXcode has no package manager or prebuilt-library support worth
      # relying on, so it gets the sources to drop into a project instead,
      # with headers renamed .h so VEXcode Pro V5 lists them.
      - name: Package VEXcode sources
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('template.pros'))['version'])")
          python3 tools/package_vexcode.py vexcode_pkg
          cd vexcode_pkg && zip -r ../hitlib-vexcode@${VERSION}.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hitlib-template
          path: |
            hitlib@*.zip
            hitlib-vexcode@*.zip

      - name: Attach to GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" hitlib@*.zip hitlib-vexcode@*.zip --clobber