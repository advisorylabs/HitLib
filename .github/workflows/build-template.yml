name: Build PROS Template

on:
  push:
    branches: [main]
    # The storefront in site/ shares this repo but not this build.
    paths-ignore:
      - 'site/**'
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Every zip is named, and the conductor versions the template, from
      # template.pros, so it has to be bumped with the Makefile's VERSION.
      - name: Check template version
        run: |
          TEMPLATE_VERSION=$(python3 -c "import json; print(json.load(open('template.pros'))['version'])")
          MAKE_VERSION=$(sed -n 's/^VERSION:=//p' Makefile | tr -d '[:space:]')
          if [ "$TEMPLATE_VERSION" != "$MAKE_VERSION" ]; then
            echo "::error file=template.pros::template.pros is version $TEMPLATE_VERSION but the Makefile's VERSION is $MAKE_VERSION"
            exit 1
          fi

      - name: Install ARM embedded toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi

      - name: Install PROS CLI
        run: |
          pip install pros-cli

      - name: Build library
        run: make

      # Kernels before 4.2.0 compile softfp, and their projects can't link the
      # hard-float archive, so a second one is built for kernel 4.1.x against
      # that kernel's own headers. 4.1.0, 4.1.1 and 4.1.2 compile HitLib to
      # identical code; 4.1.2 is the last of them.
      - name: Build softfp library for kernel 4.1
        run: |
          curl -fsSL -o "$RUNNER_TEMP/kernel-4.1.zip" "https://pros.cs.purdue.edu/v5/_static/releases/kernel@4.1.2.zip"
          echo "edaebb56bbf1f1aa08483b1df78c1136ffe75916fe1aa7d8899838a236dd7ee7  $RUNNER_TEMP/kernel-4.1.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/kernel-4.1.zip" -d "$RUNNER_TEMP/kernel-4.1"
          make softfp SOFTFP_KERNEL="$RUNNER_TEMP/kernel-4.1"

      # hitlib@VERSION.zip for kernel 4.2.0 and later, and
      # hitlib@VERSION-softfp.zip for 4.1.x. Both have the same template name,
      # and `pros c apply` picks the one whose supported_kernels fit.
      - name: Package templates
        run: |
          python3 tools/package_template.py
          python3 tools/package_template.py --softfp

      # VEXcode has no package manager or prebuilt-library support worth
      # relying on, so it gets the sources to drop into a project instead,
      # with headers renamed .h so VEXcode Pro V5 lists them.
      - name: Package VEXcode sources
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('template.pros'))['version'])")
          python3 tools/package_vexcode.py vexcode_pkg
          cd vexcode_pkg && zip -r ../hitlib-vexcode@${VERSION}.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hitlib-template
          path: |
            hitlib@*.zip
            hitlib-vexcode@*.zip

      - name: Attach to GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" hitlib@*.zip hitlib-vexcode@*.zip --clobber