name: Build PROS Template

on:
  push:
    branches: [main]
    # The storefront in site/ shares this repo but not this build.
    paths-ignore:
      - 'site/**'
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ARM embedded toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi

      - name: Install PROS CLI
        run: |
          pip install pros-cli

      - name: Build library
        run: make

      - name: Package template
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('template.pros'))['version'])")
          mkdir -p template_pkg/include template_pkg/lib
          cp -r include/ template_pkg/
          cp bin/hitlib.a template_pkg/lib/
          cp template.pros template_pkg/
          cd template_pkg && zip -r ../hitlib@${VERSION}.zip .

      # VEXcode has no package manager or prebuilt-library support worth
      # relying on, so it gets the sources to drop into a project instead,
      # with headers renamed .h so VEXcode Pro V5 lists them.
      - name: Package VEXcode sources
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('template.pros'))['version'])")
          python3 tools/package_vexcode.py vexcode_pkg
          cd vexcode_pkg && zip -r ../hitlib-vexcode@${VERSION}.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hitlib-template
          path: |
            hitlib@*.zip
            hitlib-vexcode@*.zip

      - name: Attach to GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" hitlib@*.zip hitlib-vexcode@*.zip --clobber