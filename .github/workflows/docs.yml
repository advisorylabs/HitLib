name: Deploy Docs to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'include/**'
      - 'docs/**'
      - 'Doxyfile'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Doxygen
        # apt's doxygen (1.9.8 on ubuntu-latest) predates PROJECT_ICON (added
        # Oct 2023) and can drift from whatever generated Doxyfile/header.html
        # (currently 1.16.1) -- install that exact release instead.
        run: |
          curl -fsSL -o doxygen.tar.gz https://github.com/doxygen/doxygen/releases/download/Release_1_16_1/doxygen-1.16.1.linux.bin.tar.gz
          tar -xzf doxygen.tar.gz
          sudo install -m 755 doxygen-1.16.1/bin/doxygen /usr/local/bin/doxygen
          doxygen --version

      - name: Build Docs
        run: doxygen Doxyfile

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/generated/html

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
